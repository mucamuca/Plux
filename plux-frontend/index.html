<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plux - Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg-glow"></div>
  <div class="particles" id="particles"></div>

  <div class="container">
    <!-- Header -->
    <div class="logo">
      <div class="logo-brand">
        <img src="plux-cat.gif" alt="Plux" class="logo-gif">
        <div>
          <h1>Plux</h1>
          <p>Downloads com Suporte Multiplataforma</p>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Downloads</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statYt">0</div>
        <div class="stat-label">YouTube</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statTt">0</div>
        <div class="stat-label">TikTok</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statIg">0</div>
        <div class="stat-label">Instagram</div>
      </div>
    </div>

    <!-- Platform tabs -->
    <div class="platforms">
      <button class="platform-tab tab-yt active" onclick="selectPlatform('youtube')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 00.5 6.2 31.5 31.5 0 000 12a31.5 31.5 0 00.5 5.8 3 3 0 002.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 002.1-2.1A31.5 31.5 0 0024 12a31.5 31.5 0 00-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
        <span>YouTube</span>
      </button>
      <button class="platform-tab tab-tt" onclick="selectPlatform('tiktok')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.3 5.7A4.5 4.5 0 0116.5 2h-3.4v13.5a2.8 2.8 0 11-2-2.7V9.3a6.3 6.3 0 105.5 6.2V9.8a7.9 7.9 0 004.6 1.5V7.8a4.5 4.5 0 01-1.9-2.1z"/></svg>
        <span>TikTok</span>
      </button>
      <button class="platform-tab tab-ig" onclick="selectPlatform('instagram')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c2.7 0 3 0 4.1.1 1 0 1.7.2 2.3.5.6.2 1.1.6 1.6 1.1.5.5.8 1 1.1 1.6.2.6.4 1.2.4 2.3.1 1 .1 1.4.1 4.1s0 3-.1 4.1c0 1-.2 1.7-.4 2.3a4.6 4.6 0 01-2.7 2.7c-.6.2-1.2.4-2.3.4-1 .1-1.4.1-4.1.1s-3 0-4.1-.1c-1 0-1.7-.2-2.3-.4a4.6 4.6 0 01-2.7-2.7c-.2-.6-.4-1.2-.4-2.3C2.2 15 2.2 14.6 2.2 12s0-3 .1-4.1c0-1 .2-1.7.4-2.3a4.6 4.6 0 012.7-2.7c.6-.2 1.2-.4 2.3-.4C8.9 2.2 9.3 2.2 12 2.2zm0 1.8c-2.7 0-3 0-4 .1-.9 0-1.4.2-1.7.3-.4.2-.7.4-1 .7-.3.3-.6.6-.7 1-.2.3-.3.8-.3 1.7-.1 1-.1 1.4-.1 4s0 3 .1 4c0 .9.2 1.4.3 1.7.2.4.4.7.7 1 .3.3.6.6 1 .7.3.2.8.3 1.7.3 1 .1 1.4.1 4 .1s3 0 4-.1c.9 0 1.4-.2 1.7-.3.4-.2.7-.4 1-.7.3-.3.6-.6.7-1 .2-.3.3-.8.3-1.7.1-1 .1-1.4.1-4s0-3-.1-4c0-.9-.2-1.4-.3-1.7-.2-.4-.4-.7-.7-1-.3-.3-.6-.6-1-.7-.3-.2-.8-.3-1.7-.3-1-.1-1.4-.1-4-.1zm0 3.1a4.9 4.9 0 110 9.8 4.9 4.9 0 010-9.8zm0 1.8a3.2 3.2 0 100 6.3 3.2 3.2 0 000-6.3zm5.1-3.2a1.2 1.2 0 110 2.3 1.2 1.2 0 010-2.3z"/></svg>
        <span>Instagram</span>
      </button>
    </div>

    <!-- URL input -->
    <div class="input-group">
      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        URL do vídeo
      </label>
      <div class="url-wrapper">
        <input type="text" id="url" placeholder="Cole o link do vídeo aqui..." autocomplete="off">
        <button class="paste-btn" id="pasteBtn" onclick="colarURL()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Colar
        </button>
      </div>
    </div>

    <!-- Quality -->
    <div class="input-group">
      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Qualidade
      </label>
      <select id="quality">
        <option value="best">Melhor disponível</option>
        <option value="2160">4K (2160p)</option>
        <option value="1080" selected>Full HD (1080p)</option>
        <option value="720">HD (720p)</option>
        <option value="480">Média (480p)</option>
        <option value="360">Baixa (360p)</option>
      </select>
    </div>

    <!-- Video card -->
    <div class="video-card" id="videoCard">
      <img id="thumb" src="" alt="">
      <div class="info">
        <h3 id="videoTitle"></h3>
        <div class="meta-line">
          <span class="platform-badge" id="platformBadge"></span>
          <span class="platform-badge" id="typeBadge" style="display:none"></span>
          <span id="videoMeta"></span>
        </div>
        <div class="count-info" id="countInfo" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M16 2v20M2 12h20"/></svg>
          <span id="countText"></span>
        </div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill fill-default" id="progressFill"></div>
      </div>
      <div class="progress-text">
        <span id="progressPct">0%</span>
        <span id="progressInfo">--</span>
      </div>
    </div>

    <!-- Download button -->
    <button class="btn" id="btnDownload" onclick="iniciar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Baixar vídeo
    </button>

    <div class="status" id="status"></div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Histórico
        </h2>
        <button class="clear-btn" id="clearHistory" onclick="limparHistorico()">Limpar</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history" id="emptyHistory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <div>Nenhum download ainda</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      O arquivo irá ser salvo na sua pasta de Downloads
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
